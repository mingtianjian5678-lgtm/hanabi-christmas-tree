<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <title>花火 · 正在打开欣赏版</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07090e; color: #fff4d6; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    .gateway {
      width: min(100%, 420px);
      padding: 30px 24px;
      border: 1px solid rgba(246, 216, 142, .28);
      border-radius: 22px;
      background: radial-gradient(circle at 50% 0, rgba(246, 216, 142, .14), transparent 58%), rgba(13, 15, 22, .92);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
    }
    .spark { color: #f6d88e; font-size: 38px; text-shadow: 0 0 24px rgba(246, 216, 142, .7); }
    h1 { margin: 14px 0 10px; font-size: 22px; letter-spacing: 4px; font-weight: 500; }
    p { margin: 0; color: #cfc7b7; font-size: 14px; line-height: 1.8; }
    .steps {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      color: #fff1cf;
      background: rgba(246, 216, 142, .09);
      font-size: 15px;
      line-height: 1.9;
      text-align: left;
    }
    .steps strong { color: #ffe7ad; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #17130c;
      background: #f6d88e;
      text-decoration: none;
      font-weight: 600;
    }
    .wechat .steps { display: block; }
    .wechat .normal { display: none; }
  </style>
</head>
<body>
  <main class="gateway">
    <div class="spark">✦</div>
    <h1>花火欣赏版</h1>
    <p class="normal">正在为你打开，请稍候…</p>
    <div class="steps">
      微信正在尝试打开外部浏览器。<br>
      如果没有自动跳转，请点右上角 <strong>···</strong>，选择 <strong>“在浏览器打开”</strong>。
    </div>
    <a id="manual-link" href="./appreciation.html">立即打开欣赏版</a>
  </main>
  <script>
    (() => {
      const target = new URL("./appreciation.html", location.href).href;
      const ua = navigator.userAgent || "";
      const isWeChat = /MicroMessenger/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (!isWeChat) {
        location.replace(target);
        return;
      }

      document.body.classList.add("wechat");
      document.getElementById("manual-link").href = target;

      if (isAndroid) {
        const parsed = new URL(target);
        const fallback = encodeURIComponent(target);
        const intent =
          `intent://${parsed.host}${parsed.pathname}${parsed.search}#Intent;` +
          "scheme=https;action=android.intent.action.VIEW;" +
          "category=android.intent.category.BROWSABLE;" +
          `S.browser_fallback_url=${fallback};end`;
        setTimeout(() => { location.href = intent; }, 350);
      } else if (isIOS) {
        setTimeout(() => {
          try { location.href = `x-web-search://?${encodeURIComponent(target)}`; } catch {}
        }, 350);
      }
    })();
  </script>
</body>
</html>
