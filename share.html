<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <title>花火 · 正在打开欣赏版</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07090e; color: #fff4d6; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    .gateway {
      width: min(100%, 420px);
      padding: 30px 24px;
      border: 1px solid rgba(246, 216, 142, .28);
      border-radius: 22px;
      background: radial-gradient(circle at 50% 0, rgba(246, 216, 142, .14), transparent 58%), rgba(13, 15, 22, .92);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
    }
    .spark { color: #f6d88e; font-size: 38px; text-shadow: 0 0 24px rgba(246, 216, 142, .7); }
    h1 { margin: 14px 0 10px; font-size: 22px; letter-spacing: 4px; font-weight: 500; }
    p { margin: 0; color: #cfc7b7; font-size: 14px; line-height: 1.8; }
    .steps {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      color: #fff1cf;
      background: rgba(246, 216, 142, .09);
      font-size: 15px;
      line-height: 1.9;
      text-align: left;
    }
    .steps strong { color: #ffe7ad; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 999px;
      color: #17130c;
      background: #f6d88e;
      text-decoration: none;
      font-weight: 600;
    }
    .wechat .steps { display: block; }
    .wechat .normal { display: none; }
  </style>
</head>
<body>
  <main class="gateway">
    <div class="spark">✦</div>
    <h1>花火欣赏版</h1>
    <p class="normal">正在为你打开，请稍候…</p>
    <div class="steps">
      微信正在尝试打开外部浏览器。<br>
      如果没有自动跳转，请点右上角 <strong>···</strong>，选择 <strong>“在浏览器打开”</strong>。
    </div>
    <a id="manual-link" href="./appreciation.html">立即打开欣赏版</a>
  </main>
  <script>
    (async () => {
      const currentUrl = new URL(location.href);
      const params = currentUrl.searchParams;
      const snapshotId = params.get("id");
      const ua = navigator.userAgent || "";
      const isWeChat = /MicroMessenger/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const status = document.querySelector(".normal");
      const manualLink = document.getElementById("manual-link");
      const externalUrl = new URL(currentUrl.href);
      externalUrl.searchParams.set("open", "1");
      const defaultUrl = new URL("./appreciation.html", location.href);
      defaultUrl.search = currentUrl.search;
      defaultUrl.searchParams.delete("id");
      defaultUrl.searchParams.delete("open");

      if (snapshotId && !params.has("open") && isWeChat) {
        document.body.classList.add("wechat");
        manualLink.href = externalUrl.href;
        status.textContent = "正在准备你的专属欣赏版…";

        if (isAndroid) {
          const parsed = new URL(externalUrl.href);
          const fallback = encodeURIComponent(externalUrl.href);
          const intent =
            `intent://${parsed.host}${parsed.pathname}${parsed.search}#Intent;` +
            "scheme=https;action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            `S.browser_fallback_url=${fallback};end`;
          setTimeout(() => { location.href = intent; }, 350);
        } else if (isIOS) {
          setTimeout(() => {
            try {
              location.href = `x-web-search://?${encodeURIComponent(externalUrl.href)}`;
            } catch {}
          }, 350);
        }
        return;
      }

      if (!snapshotId) {
        manualLink.href = defaultUrl.href;
        if (!isWeChat) {
          location.replace(defaultUrl.href);
          return;
        }
        document.body.classList.add("wechat");
        if (isAndroid) {
          const parsed = new URL(defaultUrl.href);
          const fallback = encodeURIComponent(defaultUrl.href);
          const intent =
            `intent://${parsed.host}${parsed.pathname}${parsed.search}#Intent;` +
            "scheme=https;action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            `S.browser_fallback_url=${fallback};end`;
          setTimeout(() => { location.href = intent; }, 350);
        } else if (isIOS) {
          setTimeout(() => {
            try {
              location.href = `x-web-search://?${encodeURIComponent(defaultUrl.href)}`;
            } catch {}
          }, 350);
        }
        return;
      }

      manualLink.href = defaultUrl.href;
      manualLink.textContent = "打开默认欣赏版";
      document.body.classList.remove("wechat");

      if (!/^[a-z0-9-]{8,48}$/.test(snapshotId)) {
        status.textContent = "这个欣赏链接格式不正确。";
        return;
      }

      const rawUrl =
        "https://cdn.jsdelivr.net/gh/mingtianjian5678-lgtm/" +
        `hanabi-christmas-tree@share-data/snapshots/${snapshotId}.json`;
      for (let attempt = 0; attempt < 16; attempt++) {
        try {
          status.textContent =
            attempt === 0 ? "正在载入你的照片…" : "照片正在生成，请稍候…";
          const response = await fetch(`${rawUrl}?t=${Date.now()}`, {
            cache: "no-store",
          });
          if (response.ok) {
            const draft = await response.json();
            if (!draft || !Array.isArray(draft.photos)) {
              throw new Error("Invalid snapshot");
            }
            localStorage.setItem(
              "hanabi-viewer-draft-v1",
              JSON.stringify(draft),
            );
            location.replace("./developer.html?mode=appreciation");
            return;
          }
        } catch {}
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
      status.textContent = "这个欣赏版暂时无法载入，请稍后刷新。";
    })();
  </script>
</body>
</html>
